version: "3.8"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: local-trading-bot
    restart: unless-stopped
    ports:
      - "6001:8000"
    volumes:
      - trading_data:/app/data
    env_file:
      - .env
    environment:
      - TZ=UTC

volumes:
  trading_data:
